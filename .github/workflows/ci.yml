name: phase-tool-ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install ".[test]"
      - name: Full test suite
        run: python -m pytest -W error -ra
      - name: Build wheel and sdist
        run: python -m build
      - name: Installed entrypoint smoke
        shell: bash
        run: |
          python -m venv .ci-venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            .ci-venv/Scripts/python -m pip install dist/*.whl
            .ci-venv/Scripts/phase --version
            .ci-venv/Scripts/phase doctor
            .ci-venv/Scripts/phase contracts list
          else
            .ci-venv/bin/python -m pip install dist/*.whl
            .ci-venv/bin/phase --version
            .ci-venv/bin/phase doctor
            .ci-venv/bin/phase contracts list
          fi
